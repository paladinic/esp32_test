<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 Atomizer Control</title>
  <style>
    /* Basic Reset */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    /* Main container */
    .container {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      width: 90%;
      max-width: 400px;
      padding: 20px;
      text-align: center;
    }

    /* Title */
    h1 {
      font-size: 1.8rem;
      color: #333;
      margin-bottom: 20px;
    }

    /* Button Styles */
    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 1rem;
      border-radius: 5px;
      cursor: pointer;
      margin: 10px 0;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #0056b3;
    }

    /* Slider */
    .slider-container {
      margin: 20px 0;
    }

    input[type="range"] {
      width: 100%;
    }

    .slider-label {
      font-size: 1rem;
      margin-top: 10px;
    }

    /* Status area */
    .status {
      margin-top: 20px;
      font-size: 0.9rem;
      color: #555;
      word-wrap: break-word;
    }

    /* Reset button */
    #resetButton {
      background-color: #dc3545;
    }

    #resetButton:hover {
      background-color: #a71d2a;
    }

  </style>
</head>
<body>
  <div class="container">
    <h1>ESP32 Atomizer Control</h1>

    <button id="connectButton">Connect to ESP32</button>

    <div class="slider-container">
      <label for="limitSlider">Press Limit (1-10):</label>
      <input type="range" id="limitSlider" min="1" max="10" value="5">
      <div class="slider-label">Current Limit: <span id="limitValue">5</span></div>
    </div>

    <button id="resetButton">Reset pressCount</button>

    <div id="status" class="status">Status: Not connected</div>
  </div>

  <script>
    // BLE Service & Characteristic UUIDs (match your ESP32 code)
    const SERVICE_UUID          = "00001234-0000-1000-8000-00805f9b34fb";
    const PRESS_LIMIT_CHAR_UUID = "00003456-0000-1000-8000-00805f9b34fb";
    const RESET_CHAR_UUID       = "00003457-0000-1000-8000-00805f9b34fb";

    let pressLimitCharacteristic;
    let resetCharacteristic;

    document.getElementById('connectButton').addEventListener('click', onConnect);
    document.getElementById('limitSlider').addEventListener('input', onSliderChange);
    document.getElementById('resetButton').addEventListener('click', onResetPressCount);

    // Handler: user clicks "Connect to ESP32"
    async function onConnect() {
      try {
        // Request device
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ namePrefix: 'ESP32-Atomizer' }],
          optionalServices: [SERVICE_UUID]
        });
        updateStatus("Device selected. Connecting...");

        // Connect to GATT server
        const server = await device.gatt.connect();
        updateStatus("Connected to GATT server.");

        // Get our custom service
        const service = await server.getPrimaryService(SERVICE_UUID);

        // Get characteristics
        pressLimitCharacteristic = await service.getCharacteristic(PRESS_LIMIT_CHAR_UUID);
        resetCharacteristic      = await service.getCharacteristic(RESET_CHAR_UUID);

        // Read the initial press limit from the device
        const valueData = await pressLimitCharacteristic.readValue();
        let limitStr = new TextDecoder().decode(valueData);
        let limit = parseInt(limitStr, 10);
        updateSliderUI(limit);

        updateStatus("Ready! Current press limit is " + limit);
      } catch (error) {
        console.error(error);
        updateStatus("Connection failed: " + error);
      }
    }

    // Handler: user moves the slider
    async function onSliderChange(event) {
      let newLimit = event.target.value;
      document.getElementById('limitValue').textContent = newLimit;

      if (!pressLimitCharacteristic) return;

      try {
        let encoder = new TextEncoder();
        let data = encoder.encode(String(newLimit));
        await pressLimitCharacteristic.writeValue(data);
        updateStatus("Wrote new limit = " + newLimit);
      } catch (error) {
        console.error("Error writing press limit:", error);
        updateStatus("Error writing press limit: " + error);
      }
    }

    // Handler: user clicks "Reset pressCount" button
    async function onResetPressCount() {
      if (!resetCharacteristic) return;

      try {
        let encoder = new TextEncoder();
        let data = encoder.encode("1");
        await resetCharacteristic.writeValue(data);
        updateStatus("pressCount reset triggered!");
      } catch (error) {
        console.error("Error resetting pressCount:", error);
        updateStatus("Error resetting pressCount: " + error);
      }
    }

    // Helper to update the slider UI
    function updateSliderUI(limit) {
      const slider = document.getElementById('limitSlider');
      slider.value = limit;
      document.getElementById('limitValue').textContent = limit;
    }

    // Helper to update a status div
    function updateStatus(msg) {
      console.log(msg);
      document.getElementById('status').textContent = "Status: " + msg;
    }
  </script>
</body>
</html>
